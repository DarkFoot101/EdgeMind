name: EdgeMind Ollama Integration Tests

on:
  workflow_dispatch:
  schedule:
    # Optional nightly run
    - cron: '0 2 * * *'

jobs:
  integration-tests:
    name: Live Ollama Integration Suite
    # Can run on self-hosted runner with Ollama service
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Run Live Ollama Integration Tests
        run: |
          pytest -v -m "ollama"
