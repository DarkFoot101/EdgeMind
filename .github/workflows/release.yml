name: Release to PyPI

# Release publishing uses a single authoritative trigger to prevent
# duplicate PyPI uploads for the same version.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  unit-tests:
    name: Unit Tests (Gating)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Run deterministic unit tests
        run: |
          pytest -v -m "not ollama"

  build-test:
    name: Build & Metadata Test (Gating)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Test build package
        run: |
          python -m build

      - name: Check package metadata
        run: |
          twine check dist/*

  publish-pypi:
    name: Build Package and Publish to PyPI
    needs: [unit-tests, build-test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Mandatory for Trusted Publishing to PyPI

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package distribution
        run: |
          rm -rf dist/ build/ *.egg-info
          python -m build

      - name: Verify package metadata
        run: |
          twine check dist/*

      - name: Publish package to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
