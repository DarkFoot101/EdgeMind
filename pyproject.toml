[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edgemind"
version = "1.0.2"
description = "Resource-Aware Agentic Coding Assistant for Local AI Software Engineering"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Akhilesh Venkiteswaran" }
]

license = { text = "MIT" }

dependencies = [
    "ollama",
    "langgraph",
    "langchain",
    "pydantic>=2.0",
    "typer",
    "psutil",
]

[project.scripts]
edgemind = "app.cli.interactive:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
markers = [
    "ollama: marks integration tests requiring a live Ollama server and local models",
    "integration: marks integration tests requiring external runtime dependencies",
]