[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edgemind"
version = "2.0.2"
description = "Resource-Aware Agentic Coding Assistant for Local AI Software Engineering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Akhilesh Venkiteswaran" }
]

keywords = [
    "ai",
    "agentic-ai",
    "local-llm",
    "ollama",
    "coding-assistant",
    "code-generation",
    "langgraph",
    "vscode-extension",
    "developer-tools",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "ollama",
    "langgraph",
    "langchain",
    "pydantic>=2.0",
    "typer",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/DarkFoot101/EdgeMind"
Repository = "https://github.com/DarkFoot101/EdgeMind.git"
Issues = "https://github.com/DarkFoot101/EdgeMind/issues"

[project.scripts]
edgemind = "app.cli.interactive:run"
edgemind-rpc = "app.cli.rpc:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["extension/bundled/*", "extension/bundled/**/*"]

[tool.pytest.ini_options]
markers = [
    "ollama: marks integration tests requiring a live Ollama server and local models",
    "integration: marks integration tests requiring external runtime dependencies",
]